  <!-- 在 header 下面新增侧边栏 -->

  <!-- 侧边栏 -->

    <!-- 👇 新增：沉浸式搜索大卡片 -->

    <div class="side-menu-body">

        <li class="menu-item"><a href="#">MENU11</a></li>

  <!-- 搜索遮罩层 -->

  <!-- 搜索面板 -->
  <div id="searchPanel" class="search-panel">
    <div class="search-container">
      <form class="search-input-group" id="searchForm" action="/search" method="GET">
        <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="search" name="q" id="searchInput" placeholder="输入关键词搜索..." autocomplete="off" enterkeyhint="search">
        <button class="search-close-btn" type="button" id="closeSearchBtn" aria-label="关闭搜索">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </form>
      
      <!-- 搜索提示区 (搜索历史) -->
      <div class="search-hints" id="searchHistoryBox" style="display: none;">
        <div class="hint-header">
          <div class="hint-title">搜索历史</div>
          <button class="clear-history-btn" id="clearHistoryBtn">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px; vertical-align: -2px;"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>清空
          </button>
        </div>
        <div class="hint-tags" id="historyTags">
          <!-- 历史记录标签会由 JS 动态生成到这里 -->
        </div>
      </div>
    </div>

<script src="https://gh.lib.aaqq.site/highlight.js/11.9.0/highlight.min.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    
    // ==========================================
    // 0. 公共 DOM 变量获取
    // ==========================================
    const openMenuBtn = document.getElementById("openMenuBtn");
    const closeMenuBtn = document.getElementById("closeMenuBtn");
    const sideMenu = document.getElementById("sideMenu");
    const menuOverlay = document.getElementById("menuOverlay");
    const sideSearchTrigger = document.getElementById("sideSearchTrigger");
    
    const openSearchBtn = document.getElementById("openSearchBtn");
    const closeSearchBtn = document.getElementById("closeSearchBtn");
    const searchOverlay = document.getElementById("searchOverlay");
    const searchPanel = document.getElementById("searchPanel");
    const searchInput = document.getElementById("searchInput");
    const searchHistoryBox = document.getElementById("searchHistoryBox");
    const historyTags = document.getElementById("historyTags");
    const clearHistoryBtn = document.getElementById("clearHistoryBtn");
    const searchForm = document.getElementById("searchForm"); // 👈 新增的获取表单

    const headerNav = document.getElementById("headerNav");
    const navMain = document.getElementById("navMain");
    const navMore = document.getElementById("navMore");
    const dropdown = document.getElementById("navMoreDropdown");
    const navLinks = Array.from(navMain.querySelectorAll("a"));

    const openTocBtn = document.getElementById("openTocBtn");
    const closeTocBtn = document.getElementById("closeTocBtn");
    const tocModal = document.getElementById("tocModal");


    // ==========================================
    // 1. 全局/通用功能 (代码高亮 & 复制)
    // ==========================================
    if (typeof hljs !== 'undefined') {
      hljs.highlightAll();
    }

    // 1. 全局/通用功能 (代码高亮 & 复制 & 行号)
    if (typeof hljs !== 'undefined') {
      hljs.highlightAll();
    }

    document.querySelectorAll("pre").forEach((pre) => {
      const code = pre.querySelector("code");
      if (!code) return;

          // --- 👇 终结版：按行拆分，彻底解决错位 ---
      const codeText = code.textContent || "";
      const lines = codeText.split('\n');
      if (lines.length > 0 && lines[lines.length - 1].trim() === '') lines.pop();

      // 获取高亮后的 HTML，按行拆分
      const highlightedLines = code.innerHTML.split('\n');
      
      let newHtml = '';
      lines.forEach((_, index) => {
        newHtml += `<div class="code-line">`;
        newHtml += `<span class="line-num">${index + 1}</span>`;
        // 如果高亮插件那一行有内容，就放进去，否则给个空格占位
        newHtml += `<span class="line-text">${highlightedLines[index] || ' '}</span>`;
        newHtml += `</div>`;
      });

      code.innerHTML = newHtml;
      pre.classList.add("has-line-numbers");
      // --- 👆 替换结束 ---

      // 原有的语言识别逻辑
      let lang = "code";
      const classList = Array.from(code.classList);
      const langClass = classList.find(c => c.startsWith("language-") || c.startsWith("lang-")) || classList.find(c => c !== "hljs");

      if (langClass) {
        lang = langClass.replace("language-", "").replace("lang-", "");
      }
      pre.setAttribute("data-lang", lang);
      
      // 👇 终极复制逻辑：完美避开行号
      pre.addEventListener("click", (e) => {
        const rect = pre.getBoundingClientRect();
        if (e.clientY - rect.top < 40 && e.clientX > rect.right - 100) {
          const contentToCopy = Array.from(code.querySelectorAll('.line-text'))
                                     .map(el => el.textContent)
                                     .join('\n');
          
          navigator.clipboard.writeText(contentToCopy).then(() => {
            pre.classList.add("copied");
            setTimeout(() => pre.classList.remove("copied"), 1500);
          }).catch((err) => console.error("复制失败: ", err));
        }
      });
    });


    // ==========================================
    // 2. 顶部导航折叠加算
    // ==========================================
    const checkNavOverflow = () => {
      if (window.innerWidth <= 820) return;
      navMore.classList.remove("show");
      dropdown.innerHTML = "";
      navLinks.forEach(link => link.style.display = "");
      const moreBtnWidth = navMore.querySelector('.nav-more-btn').offsetWidth || 40;
      const availableWidth = headerNav.offsetWidth - moreBtnWidth - 20;
      if (navMain.scrollWidth > availableWidth) {
        navMore.classList.add("show");
        for (let i = navLinks.length - 1; i >= 0; i--) {
          const link = navLinks[i];
          link.style.display = "none"; 
          const clone = link.cloneNode(true);
          clone.style.display = "block";
          dropdown.prepend(clone);
          if (navMain.scrollWidth <= availableWidth) break;
        }
      }
    };
    requestAnimationFrame(checkNavOverflow);
    let navTimeout;
    window.addEventListener("resize", () => {
      clearTimeout(navTimeout);
      navTimeout = setTimeout(checkNavOverflow, 100);
    });


    // ==========================================
    // 3. 左侧侧边栏逻辑
    // ==========================================
    if (openMenuBtn) {
      openMenuBtn.addEventListener("click", () => {
        sideMenu.classList.add("show");
        menuOverlay.classList.add("show");
        document.body.classList.add("modal-open");
      });
    }
    const closeMenu = () => {
      sideMenu.classList.remove("show");
      menuOverlay.classList.remove("show");
      document.body.classList.remove("modal-open");
    };
    if (closeMenuBtn) closeMenuBtn.addEventListener("click", closeMenu);
    if (menuOverlay) menuOverlay.addEventListener("click", closeMenu);
    document.querySelectorAll(".menu-link").forEach(link => {
      link.addEventListener("click", closeMenu);
    });


    // ==========================================
    // 4. 搜索弹窗核心逻辑 (历史记录 & 开关)
    // ==========================================
    const getHistory = () => {
      try { return JSON.parse(localStorage.getItem("myBlogSearchHistory")) || []; } 
      catch (e) { return []; }
    };

    const renderHistory = () => {
      const history = getHistory();
      if (history.length === 0) {
        searchHistoryBox.style.display = "none";
        return;
      }
      searchHistoryBox.style.display = "block";
      historyTags.innerHTML = history.map(tag => `<span class="hint-tag">${tag}</span>`).join("");

      document.querySelectorAll("#historyTags .hint-tag").forEach(tag => {
        tag.addEventListener("click", () => {
          searchInput.value = tag.innerText;
          saveHistory(tag.innerText);
          if (searchForm) {
            searchForm.requestSubmit();
          }
        });
      });
    };

    const saveHistory = (keyword) => {
      let history = getHistory().filter(item => item !== keyword);
      history.unshift(keyword);
      if (history.length > 5) history = history.slice(0, 5);
      localStorage.setItem("myBlogSearchHistory", JSON.stringify(history));
      renderHistory();
    };

    if (clearHistoryBtn) {
      clearHistoryBtn.addEventListener("click", () => {
        localStorage.removeItem("myBlogSearchHistory");
        renderHistory();
      });
    }

    const openSearchPanel = () => {
      searchOverlay.classList.remove("no-overlay-bg");
      searchOverlay.classList.add("show");
      searchPanel.classList.add("show");
      document.body.classList.add("modal-open");
      renderHistory(); 
      searchInput.focus(); 
      searchInput.click(); 
    };

    const closeSearch = () => {
      searchOverlay.classList.remove("show");
      searchPanel.classList.remove("show");
      searchInput.value = ""; 
      searchOverlay.classList.remove("no-overlay-bg");
      if (menuOverlay && menuOverlay.classList.contains("show")) {
        menuOverlay.classList.remove("show");
      }
      document.body.classList.remove("modal-open");
    };

    if (openSearchBtn) {
      openSearchBtn.addEventListener("click", openSearchPanel);
    }
    if (closeSearchBtn) closeSearchBtn.addEventListener("click", closeSearch);
    if (searchOverlay) searchOverlay.addEventListener("click", closeSearch);

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && searchPanel.classList.contains("show")) closeSearch();
    });

    if (searchForm) {
      searchForm.addEventListener("submit", (e) => {
        const keyword = searchInput.value.trim();
        if (keyword !== "") {
          saveHistory(keyword);
        } else {
          e.preventDefault(); 
        }
      });
    }

    // ==========================================
    // 5. 侧边栏搜索联动 (完美共用遮罩)
    // ==========================================
    if (sideSearchTrigger) {
      sideSearchTrigger.addEventListener("click", () => {
        sideMenu.classList.add("no-transition");
        sideMenu.classList.remove("show");
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            sideMenu.classList.remove("no-transition");
          });
        });
        
        if (searchOverlay && searchPanel) {
          searchOverlay.classList.add("no-overlay-bg");
          searchOverlay.classList.add("show"); 
          searchPanel.classList.add("show"); 
          document.body.classList.add("modal-open");
          if (typeof renderHistory === 'function') renderHistory();
          searchInput.focus(); // 瞬间弹出键盘
          searchInput.click(); // 手机端保险
        }
      });
    }


    // ==========================================
    // 6. 文章目录弹窗 (TOC)
    // ==========================================
    if (openTocBtn) {
      openTocBtn.addEventListener("click", () => {
        tocModal.showModal();
        document.body.classList.add("modal-open");
      });
    }
    const closeTocModal = () => {
      tocModal.classList.add("closing");
      setTimeout(() => {
        tocModal.close();
        tocModal.classList.remove("closing");
        document.body.classList.remove("modal-open");
      }, 300); 
    };
    if (closeTocBtn) closeTocBtn.addEventListener("click", closeTocModal);
    if (tocModal) {
      tocModal.addEventListener("click", (e) => {
        const rect = tocModal.getBoundingClientRect();
        const isInDialog = (
          e.clientX >= rect.left && e.clientX <= rect.right &&
          e.clientY >= rect.top && e.clientY <= rect.bottom
        );
        if (!isInDialog) closeTocModal();
      });
    }
    document.querySelectorAll(".toc-item").forEach(item => {
      item.addEventListener("click", closeTocModal);
    });

    // ==========================================
    // 7. 自动为所有 Markdown 表格包裹滚动容器
    // ==========================================
    document.querySelectorAll('.article-section table').forEach(table => {
      const wrapper = document.createElement('div');
      wrapper.className = 'table-wrap';
      table.parentNode.insertBefore(wrapper, table);
      wrapper.appendChild(table);
    });

    // ==========================================
    // 8. 返回顶部按钮
    // ==========================================
    const backToTopBtn = document.getElementById("backToTop");
    
    if (backToTopBtn) {
      // 监听页面滚动
      window.addEventListener("scroll", () => {
        // 动态计算触发距离：比如手机端，滑动超过 1.5 个屏幕高度才出现
        const triggerDistance = window.innerHeight * 1.5; 
        
        if (window.scrollY > triggerDistance) {
          backToTopBtn.classList.add("show");
        } else {
          backToTopBtn.classList.remove("show");
        }
      });

      // 点击回到顶部
      backToTopBtn.addEventListener("click", () => {
        window.scrollTo({
          top: 0,
          behavior: "smooth" // 平滑滚动
        });
      });
    }

  });
</script>
<!-- 引入 PhotoSwipe 核心库 -->
<script type="module">
  const style = document.createElement('style');
  style.textContent = `
    .pswp { backdrop-filter: blur(10px) !important; -webkit-backdrop-filter: blur(10px) !important; }
    .pswp__bg { background: rgba(0, 0, 0, 0.95) !important; opacity: 1 !important; }
    .pswp__button--zoom { display: none !important; }
  `;
  document.head.appendChild(style);

  import PhotoSwipeLightbox from 'https://cdnjs.cloudflare.com/ajax/libs/photoswipe/5.4.2/photoswipe-lightbox.esm.min.js';
  import PhotoSwipe from 'https://cdnjs.cloudflare.com/ajax/libs/photoswipe/5.4.2/photoswipe.esm.min.js';

  const lightbox = new PhotoSwipeLightbox({
    pswpModule: PhotoSwipe,
    bgOpacity: 0.9,
    showHideAnimationType: 'none', // 👈 核心：直接禁用淡入动画，秒出纯黑底！
    wheelToZoom: true,
    loop: true,
    clickToClose: false, 
  });
  lightbox.init();

  // 👇 区分“点击”和“滑动”
  lightbox.on('beforeOpen', () => {
    // 解除网页缩放限制，允许图片放大
    document.querySelector('meta[name="viewport"]').setAttribute('content', 'width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, user-scalable=yes');
    // 关闭时，重新把网页缩放锁死
    lightbox.pswp.on('destroy', () => {
      document.querySelector('meta[name="viewport"]').setAttribute('content', 'width=device-width, initial-scale=1, maximum-scale=1');
    });
  });

  // 抓图逻辑
  const bindImages = () => {
    const allImgs = Array.from(document.querySelectorAll('main img'));
    const realImages = allImgs.filter(img => {
      if (img.closest('.comments') || img.closest('.site-header')) return false;
      return img.clientWidth > 50;
    });

    if (realImages.length === 0 || realImages[0].dataset.pswpBound) return;

    realImages.forEach((img, index) => {
      img.style.cursor = 'zoom-in';
      img.dataset.pswpBound = 'true';
      
      img.addEventListener('click', (e) => {
        e.preventDefault();
        const items = realImages.map(image => {
          return { 
            src: image.src,
            width: 2000, 
            height: 2000
          };
        });
        lightbox.loadAndOpen(index, items);
      });
    });
  };

  bindImages();
  
  const observer = new MutationObserver(() => {
    bindImages();
  });
  observer.observe(document.body, { childList: true, subtree: true });
</script>

</body>
